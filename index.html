<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مقایسه نقشه ایران: حال و قاجار</title>
    <style>
        body { font-family: Tahoma; text-align: center; background: #f0f0f0; margin: 0; padding: 20px; }
        .container {
            position: relative;
            width: 90%;
            max-width: 1000px;
            margin: 20px auto;
            overflow: hidden;
            border: 3px solid #333;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
        .image {
            width: 100%;
            display: block;
        }
        .after {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%; 
            overflow: hidden;
            height: 100%;
        }
        .slider {
            position: absolute;
            top: 0;
            left: 50%;
            width: 4px;
            height: 100%;
            background: white;
            cursor: ew-resize;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            z-index: 10;
        }
        .slider::after {
            content: '◀ ▶';
            position: absolute;
            top: 50%;
            left: -20px;
            color: white;
            font-size: 30px;
            transform: translateY(-50%);
        }
        h1 { color: #0066cc; }
    </style>
</head>
<body>
    <h1>نقشه ایران</h1>
    <p>خط وسط رو بکش (drag) یا کلیک کن تا مقایسه کنی</p>
    
    <div class="container" id="container">
        <img src="Iran_provinces.svg" alt="ایران کنونی" class="image">
        
        <div class="after" id="after">
            <img src="Capture.PNG" alt="ایران قاجار" class="image">
        </div>
        
        <div class="slider" id="slider"></div>
    </div>

    <script>
        const container = document.getElementById('container');
        const after = document.getElementById('after');
        const slider = document.getElementById('slider');
        
        let isDragging = false;
        
        function moveSlider(x) {
            const rect = container.getBoundingClientRect();
            let percent = ((x - rect.left) / rect.width) * 100;
            percent = Math.max(0, Math.min(100, percent));
            after.style.width = percent + '%';
            slider.style.left = percent + '%';
        }
        
        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            moveSlider(e.clientX);
        });
        
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', (e) => {
            if (isDragging) moveSlider(e.clientX);
        });
        
        container.addEventListener('touchstart', (e) => {
            isDragging = true;
            moveSlider(e.touches[0].clientX);
        });
        window.addEventListener('touchend', () => isDragging = false);
        window.addEventListener('touchmove', (e) => {
            if (isDragging) moveSlider(e.touches[0].clientX);
        });
        
        // کلیک مستقیم
        container.addEventListener('click', (e) => moveSlider(e.clientX));
    </script>
</body>
</html>
